name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip
          # Install the project itself rather than re-listing its dependencies
          # here. The hand-written list used to omit jsonschema, which every
          # import of autoctf_gan needs, so this job failed before it reached a
          # single test. pyproject.toml is now the one place that list lives.
          pip install -e .

      # fpylll needs fplll + GMP/MPFR headers and is the only optional piece.
      # Without it crypto_ladder drops the Boneh-Durfee rung and the tests that
      # need it skip themselves, so a failure here must not fail the run.
      - name: Install fpylll (optional — gates the Boneh-Durfee rung)
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install -y libfplll-dev libgmp-dev libmpfr-dev libqd-dev
          pip install cysignals fpylll

      # Build the agent image so the tests exercise the Docker backend — the
      # configuration production actually runs. Without it, docker_available()
      # still sees a daemon (GitHub runners ship one) but every agent run hits a
      # missing image, exit 125, and falls back to subprocess + unshare. That
      # fallback is fine on a normal host but breaks inside the runner's
      # restricted user namespace, which is what failed the loopback test.
      - name: Build the agent sandbox image
        run: docker build -t autoctf-arena-agent:latest -f Dockerfile.agent .

      - name: Report what the ladder will actually offer
        run: |
          python - <<'PY'
          from arena_platform.tracks import warmup, all_tracks
          from arena_platform.sandbox import backend_report, available_libraries
          warmup()
          for key, track in all_tracks().items():
              print(f"{key:8s} {len(track.rungs)} rungs: {' -> '.join(track.rungs)}")
          print("libraries:", available_libraries())
          print("isolation:", backend_report())
          PY

      - name: Arena platform tests
        run: python -m unittest tests.test_arena -v

      - name: Challenge engine tests
        run: python -m unittest tests.test_autoctf -v

      # test_factory drives Docker for the web attack/defend arena, which is not
      # available on a plain runner; run the rest and let that one report.
      - name: Challenge factory tests
        continue-on-error: true
        run: python -m unittest tests.test_factory -v
