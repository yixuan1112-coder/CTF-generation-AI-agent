# nginx alternative to the Caddyfile. Same two requirements: do not buffer the
# SSE stream, and allow an upload body larger than the app's 8 MB agent cap.
#
# Get certificates with: sudo certbot --nginx -d arena.example.com

server {
    listen 80;
    server_name arena.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name arena.example.com;

    ssl_certificate     /etc/letsencrypt/live/arena.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/arena.example.com/privkey.pem;

    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Required for the live match stream. The app already sends
        # X-Accel-Buffering: no, but set it here too so a config change upstream
        # cannot silently break streaming.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }
}
