[project]
name = "ctf-arena-factory"
version = "0.6.0"
description = "AI-assisted, validator-gated CTF challenge factory"
requires-python = ">=3.11"

[project.scripts]
ctf-factory = "ctf_factory.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.setuptools.package-data]
ctf_factory = ["studio_static/*.html", "studio_static/*.css", "studio_static/*.js"]
